<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Python 新手課程分享</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
      :root {
        color-scheme: light;
        --line: #06c755;
        --ink: #1f2937;
        --muted: #667085;
        --bg: #f7f8fa;
        --panel: #ffffff;
        --border: #e5e7eb;
        --danger: #b42318;
        --danger-bg: #fff1f0;
        --ok-bg: #ecfdf3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }

      main {
        width: min(100%, 720px);
        margin: 0 auto;
        padding: 40px 20px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 28px;
        box-shadow: 0 18px 45px rgb(15 23 42 / 8%);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--line);
        font-size: 14px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 6vw, 42px);
        line-height: 1.15;
        letter-spacing: 0;
      }

      .intro {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.7;
      }

      .status {
        margin: 24px 0;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fafafa;
        color: var(--muted);
        line-height: 1.5;
      }

      .status.ready {
        border-color: #abefc6;
        background: var(--ok-bg);
        color: #067647;
      }

      .status.error {
        border-color: #fecdca;
        background: var(--danger-bg);
        color: var(--danger);
      }

      button {
        width: 100%;
        min-height: 52px;
        border: 0;
        border-radius: 8px;
        background: var(--line);
        color: white;
        cursor: pointer;
        font-size: 17px;
        font-weight: 700;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .note {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel" aria-labelledby="page-title">
        <p class="eyebrow">LINE LIFF Flex Message</p>
        <h1 id="page-title">分享 10 堂 Python 新手課程</h1>
        <p class="intro">
          按下按鈕後，LINE 會開啟分享對象選擇器，並送出一組 Python
          入門課程小卡。
        </p>

        <div id="status" class="status" role="status">正在初始化 LIFF...</div>
        <button id="shareButton" type="button" disabled>分享課程小卡</button>
        <p class="note">
          第一次部署前，請先把程式裡的 YOUR_LIFF_ID 換成 LINE Developers
          Console 裡的 LIFF ID。
        </p>
      </section>
    </main>

    <script>
      const LIFF_ID = "YOUR_LIFF_ID";
      const statusEl = document.querySelector("#status");
      const shareButton = document.querySelector("#shareButton");

      function setStatus(message, type = "") {
        statusEl.textContent = message;
        statusEl.className = `status ${type}`.trim();
      }

      async function loadFlexMessage() {
        const response = await fetch("./flex.json", { cache: "no-store" });
        if (!response.ok) {
          throw new Error("讀取 flex.json 失敗，請確認檔案已部署。");
        }

        return response.json();
      }

      async function initLiff() {
        if (LIFF_ID === "YOUR_LIFF_ID") {
          setStatus("尚未設定 LIFF ID：請先將 YOUR_LIFF_ID 換成你的 LIFF ID。", "error");
          return;
        }

        try {
          await liff.init({ liffId: LIFF_ID });

          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }

          if (!liff.isApiAvailable("shareTargetPicker")) {
            setStatus(
              "目前環境無法使用 Share Target Picker。請確認已在 LINE Developers 啟用，並用支援的 LINE 環境開啟。",
              "error",
            );
            return;
          }

          shareButton.disabled = false;
          setStatus("LIFF 已初始化，可以分享課程小卡。", "ready");
        } catch (error) {
          setStatus(`LIFF 初始化失敗：${error.message}`, "error");
        }
      }

      async function shareCourseCards() {
        shareButton.disabled = true;
        setStatus("正在開啟 LINE 分享視窗...");

        try {
          const flexMessage = await loadFlexMessage();
          const result = await liff.shareTargetPicker([flexMessage]);

          if (result) {
            setStatus("分享完成，對方會收到 Python 課程小卡。", "ready");
          } else {
            setStatus("你已關閉分享視窗，尚未送出訊息。");
          }
        } catch (error) {
          setStatus(`分享失敗：${error.message}`, "error");
        } finally {
          shareButton.disabled = false;
        }
      }

      shareButton.addEventListener("click", shareCourseCards);
      initLiff();
    </script>
  </body>
</html>
